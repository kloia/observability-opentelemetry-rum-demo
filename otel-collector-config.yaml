receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Demo only: the browser's origin is the EC2's own IP, which isn't known until
          # the instance exists. A real deployment would list the exact origin instead.
          allowed_origins: ["*"]
          allowed_headers: ["*"]

processors:
  batch:

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
