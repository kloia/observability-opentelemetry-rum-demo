services:
  juice-shop:
    build: ./juice-shop
    ports:
      - "3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./geoip/GeoIP2-City-Test.mmdb:/etc/otelcol/GeoIP2-City-Test.mmdb:ro # downloaded by setup.sh
    ports:
      - "4318:4318" # OTLP/HTTP, the only protocol the Web SDK uses
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3001:3000" # 3000 is juice-shop's
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/dashboard-provider.yaml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
    depends_on:
      - tempo
